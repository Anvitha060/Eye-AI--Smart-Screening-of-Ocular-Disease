<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Eye-AI Smart Screening of Ocular Diseases</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #0ea5e9;
  --blue2: #38bdf8;
  --blue3: #0284c7;
  --purple: #8b5cf6;
  --green: #10b981;
  --dark: #020817;
  --dark2: #0a1628;
  --dark3: #0f2040;
  --card: rgba(255,255,255,0.04);
  --border: rgba(14,165,233,0.15);
  --text: #f1f5f9;
  --muted: #64748b;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Inter',sans-serif;
  background:var(--dark);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
nav {
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 72px;
  background:rgba(2,8,23,0.85);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(24px);
}
.logo {
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:var(--text);
}
.logo-box {
  width:34px; height:34px;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
}
.logo-name { font-size:17px; font-weight:700; letter-spacing:-0.3px; }
.logo-name span { color:var(--blue); }
.nav-right { display:flex; align-items:center; gap:12px; }
.btn-outline {
  padding:8px 18px;
  border-radius:8px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  font-size:13px;
  font-weight:600;
  text-decoration:none;
  transition:all 0.2s;
}
.btn-outline:hover { background:var(--card); }
.btn-solid {
  padding:8px 18px;
  border-radius:8px;
  background:var(--blue);
  color:white;
  font-size:13px;
  font-weight:600;
  text-decoration:none;
  transition:all 0.2s;
}
.btn-solid:hover { background:var(--blue3); }

/* Main */
.main {
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
  position:relative;
  overflow:hidden;
}
.main::before {
  content:'';
  position:absolute;
  top:30%; left:50%;
  transform:translate(-50%,-50%);
  width:500px; height:500px;
  background:radial-gradient(circle,rgba(14,165,233,0.06),transparent 70%);
  pointer-events:none;
}

.login-card {
  background:var(--dark2);
  border:1px solid var(--border);
  border-radius:20px;
  padding:48px;
  width:100%;
  max-width:440px;
  position:relative;
  animation:fade-up 0.5s ease both;
}
@keyframes fade-up {
  from { opacity:0; transform:translateY(24px); }
  to { opacity:1; transform:translateY(0); }
}

.card-icon {
  width:56px; height:56px;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  margin-bottom:24px;
}
.card-title {
  font-size:26px;
  font-weight:800;
  letter-spacing:-0.5px;
  margin-bottom:6px;
  color:var(--text);
}
.card-desc {
  font-size:14px;
  color:var(--muted);
  margin-bottom:32px;
  line-height:1.6;
}

/* Admin hint */
.admin-hint {
  background:rgba(14,165,233,0.06);
  border:1px solid rgba(14,165,233,0.15);
  border-radius:10px;
  padding:12px 16px;
  font-size:12px;
  color:var(--blue2);
  margin-bottom:24px;
  display:flex;
  align-items:center;
  gap:8px;
}

/* Error */
.error-box {
  background:rgba(239,68,68,0.08);
  border:1px solid rgba(239,68,68,0.2);
  border-radius:10px;
  padding:12px 16px;
  font-size:13px;
  color:#f87171;
  margin-bottom:20px;
  display:flex;
  align-items:center;
  gap:8px;
}

/* Form */
.form-group { margin-bottom:20px; }
.form-label {
  display:block;
  font-size:12px;
  font-weight:600;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.06em;
  margin-bottom:8px;
}
.form-input {
  width:100%;
  background:var(--dark3);
  border:1px solid var(--border);
  border-radius:10px;
  padding:13px 16px;
  color:var(--text);
  font-size:14px;
  font-family:'Inter',sans-serif;
  outline:none;
  transition:all 0.2s;
}
.form-input:focus {
  border-color:var(--blue);
  background:rgba(14,165,233,0.04);
  box-shadow:0 0 0 3px rgba(14,165,233,0.1);
}
.form-input::placeholder { color:var(--muted); }

.btn-submit {
  width:100%;
  background:var(--blue);
  color:white;
  padding:14px;
  border:none;
  border-radius:10px;
  font-size:15px;
  font-weight:700;
  font-family:'Inter',sans-serif;
  cursor:pointer;
  transition:all 0.25s;
  margin-top:4px;
}
.btn-submit:hover {
  background:var(--blue3);
  transform:translateY(-1px);
  box-shadow:0 8px 25px rgba(14,165,233,0.35);
}

.bottom-link {
  text-align:center;
  margin-top:24px;
  font-size:13px;
  color:var(--muted);
}
.bottom-link a {
  color:var(--blue);
  text-decoration:none;
  font-weight:600;
}
.bottom-link a:hover { color:var(--blue2); }

/* Divider */
.divider {
  display:flex;
  align-items:center;
  gap:12px;
  margin:24px 0;
}
.divider-line {
  flex:1;
  height:1px;
  background:var(--border);
}
.divider-text {
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
}
</style>
</head>
<body>

<nav>
  <a href="/" class="logo">
    <div class="logo-box">👁</div>
    <span class="logo-name">Eye-<span>AI</span></span>
  </a>
  <div class="nav-right">
    <a href="/" class="btn-outline">← Home</a>
    <a href="/register" class="btn-solid">Register</a>
  </div>
</nav>

<div class="main">
  <div class="login-card">
    <div class="card-icon">🔑</div>
    <h2 class="card-title">Welcome Back!</h2>
    <p class="card-desc">Login to access your Eye-AI screening dashboard</p>

    <div class="admin-hint">
      👨‍💼 Admin: admin@eyeai.com / admin123
    </div>

    {% if error %}
    <div class="error-box">❌ {{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label class="form-label">📧 Email Address</label>
        <input type="email" name="email"
               class="form-input"
               placeholder="Enter your email"
               required>
      </div>
      <div class="form-group">
        <label class="form-label">🔒 Password</label>
        <input type="password" name="password"
               class="form-input"
               placeholder="Enter your password"
               required>
      </div>
      <button type="submit" class="btn-submit">
        Login to Eye-AI →
      </button>
    </form>

    <div class="bottom-link">
      Don't have an account?
      <a href="/register">Register here</a>
    </div>
  </div>
</div>

</body>
</html>
